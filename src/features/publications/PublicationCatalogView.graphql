query PublicationCatalog($criteria: PubSearchCriteria! = {}) {
  pubSearch(criteria: $criteria) {
    id
    name
    type
    pubDate
    serialNumber
    pubIndexId
    details {
      __typename
      cover
      ... on MagDetails {
        volume
        issue
        issueName
      }
      ... on BookDetails {
        edition
      }
    }
    transcriptions {
      id
      song {
        id
        title
      }
    }
  }
}
